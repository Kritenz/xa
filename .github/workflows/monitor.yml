name: Monitor entradas

on:
  repository_dispatch:
    types: [ejecutar-monitor] # Evento personalizado que disparará el cron externo
  workflow_dispatch:          # Te permite seguir ejecutándolo manualmente desde la web

concurrency:
  group: monitor-entradas
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install selenium requests
      - run: python monitor.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
